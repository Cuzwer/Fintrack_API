basePath: /
definitions:
  domain.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id_user:
        type: integer
      password:
        type: string
    type: object
  domain.User_Login:
    properties:
      email:
        type: string
      jwt:
        type: string
      password:
        type: string
    type: object
host: localhost:7070
info:
  contact: {}
  description: ระบบ API สำหรับจัดการการเงินส่วนบุคคล (FinTrack)
  title: FinTrack API
  version: "1.0"
paths:
  /api/v1/user/:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all users containing only their IDs and Emails
        for testing purposes.
      produces:
      - application/json
      responses:
        "200":
          description: Success with user list
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Get all users
      tags:
      - Users
  /api/v1/user/{id}:
    delete:
      consumes:
      - application/json
      description: Remove a user account permanently from the database using their
        ID.
      parameters:
      - description: User ID to delete
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Successfully Deleted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid ID or user not found
          schema:
            type: string
      summary: Delete a user by ID
      tags:
      - Users
  /api/v1/user/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password, returning a HttpOnly
        JWT Token via Cookie.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.User_Login'
      produces:
      - application/json
      responses:
        "202":
          description: Login Successful (Sets jwt_Token cookie)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid credentials or bad payload
          schema:
            type: string
      summary: User Login
      tags:
      - Authentication
  /api/v1/user/register:
    post:
      consumes:
      - application/json
      description: Create a new user account using an email and password.
      parameters:
      - description: Registration credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.User'
      produces:
      - application/json
      responses:
        "202":
          description: Successfully Registered
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request / Validation Error
          schema:
            type: string
      summary: Register a new user
      tags:
      - Authentication
swagger: "2.0"
